# Render Infrastructure Blueprint for Prathyusha Engineering College Digital Leave Permission Portal
version: "1"

databases:
  - name: pec-leave-portal-db
    databaseName: pec_db
    user: pec_user
    plan: free
    region: singapore

services:
  # 1. Backend API & Real-Time Socket.IO Server
  - type: web
    name: pec-leave-portal-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && node database/seed.js && npm run build
    startCommand: node backend/src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: pec-leave-portal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: pec-leave-portal-frontend
          property: url

  # 2. Frontend Production Static Web App
  - type: web
    name: pec-leave-portal-frontend
    env: static
    region: singapore
    plan: free
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: pec-leave-portal-backend
          property: url
          suffix: /api
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: pec-leave-portal-backend
          property: url
